# Desired state for the Argo CD POC.
#
# This mirrors how PepGenX runs it: the configs repo holds the workload
# definition and the image tag, and NOTHING ELSE. Credentials arrive as a
# Secret created out of band (Key Vault / secret provider class on their side),
# referenced here only by name, so this file is safe to keep in Git.
apiVersion: v1
kind: Namespace
metadata:
  name: agents-poc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-chat-agent
  namespace: agents-poc
  labels:
    app: openai-chat-agent
    platform/agent: openai-chat-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openai-chat-agent
  template:
    metadata:
      labels:
        app: openai-chat-agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/patel-lyzr/openai-chat-agent:3623b128e05fb323dc9aaa8ebee095fe68702966
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_MODEL
              value: gpt-4o-mini  # poc: end-to-end, argo posts this
          envFrom:
            - secretRef:
                name: agent-env
                optional: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: openai-chat-agent
  namespace: agents-poc
spec:
  selector:
    app: openai-chat-agent
  ports:
    - port: 80
      targetPort: 8000

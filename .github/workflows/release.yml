# CI here, CD in Argo CD, governance in the Lyzr control plane.
#
# This pipeline builds and reports; the control plane makes one decision; Argo
# CD deploys whatever deploy/ says. Writing the digest back into
# deploy/agent.yaml is the handover — in a larger setup that is a separate
# configs repo, here one repo plays both parts.
#
# Logic lives in ci/*.sh rather than inline, so a shell quoting mistake is a
# script bug and not a workflow that refuses to start.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  ENVIRONMENT: dev
  LYZR_URL: ${{ vars.CONTROL_PLANE_URL }}
  AGENT_ID: ${{ vars.AGENT }}
  VERSION: ${{ vars.VERSION }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Report to the ledger
        continue-on-error: true
        env:
          LYZR_TOKEN: ${{ secrets.CP_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./ci/report.sh

      - name: Release gate
        env:
          LYZR_TOKEN: ${{ secrets.CP_API_KEY }}
        run: ./ci/gate-check.sh

      - name: Pin the digest for Argo CD
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: ./ci/pin-image.sh

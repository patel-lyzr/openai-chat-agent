# CI here, CD on the control plane: build the image, push it to GHCR,
# then hand the URI to the platform's deploy hook. The platform publishes
# it as a new agent version and rolls it through dev -> staging -> prod.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # THE CD HOOK — the only integration the platform needs. Configure two
      # repo secrets to arm it:
      #   CONTROL_PLANE_URL  e.g. https://controlplane.test.studio.lyzr.ai/cp-api
      #   CP_API_KEY         a cpk_… service-account key
      # and set AGENT to your registered agent's slug or agt_… ID.
      - name: Release to the control plane
        if: ${{ vars.AGENT != '' }}
        env:
          CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
          CP_API_KEY: ${{ secrets.CP_API_KEY }}
          AGENT: ${{ vars.AGENT }}
        run: |
          curl --fail-with-body -sS -X POST "$CONTROL_PLANE_URL/agents/$AGENT/deploy" \
            -H "Authorization: Bearer $CP_API_KEY" \
            -H "content-type: application/json" \
            -d "{\"stage\": \"dev\", \
                 \"image_uri\": \"ghcr.io/${{ github.repository }}:${{ github.sha }}\", \
                 \"git_sha\": \"${{ github.sha }}\", \
                 \"confirm\": true}"
